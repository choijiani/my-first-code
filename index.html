<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Seoul Weather</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #weather { font-size: 1.2em; }
    </style>
</head>
<body>
    <h1>서울 날씨</h1>
    <div id="weather">Loading...</div>
    <script>
        async function fetchWeather() {
            const apiKey = "YOUR_API_KEY";
            const city = "Seoul";
            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric&lang=kr`);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.json();
                const temp = data.main.temp;
                const description = data.weather[0].description;
                document.getElementById('weather').textContent = `${temp}°C, ${description}`;
            } catch (error) {
                console.error('Error fetching weather:', error);
                document.getElementById('weather').textContent = '날씨 정보를 가져올 수 없습니다.';
            }
        }
        fetchWeather();
    </script>
</body>
</html>
