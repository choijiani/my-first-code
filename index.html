<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>
</head>
<body>
    <h1>더하기 계산기</h1>
    <input type="number" id="num1" placeholder="첫 번째 숫자" />
    <input type="number" id="num2" placeholder="두 번째 숫자" />
    <button onclick="addNumbers()">계산하기</button>
    <p id="result"></p>
    <script>
        function addNumbers() {
            var num1 = parseFloat(document.getElementById('num1').value) || 0;
            var num2 = parseFloat(document.getElementById('num2').value) || 0;
            var sum = num1 + num2;
            document.getElementById('result').textContent = '결과: ' + sum;
        }
    </script>
</body>
</html>
